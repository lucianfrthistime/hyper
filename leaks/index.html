<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>source code leaks</title>
    <style>
        body {
            background: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .file {
            padding: 10px;
            margin: 5px 0;
            background: #1e1e1e;
            border-radius: 6px;
        }

        .file a {
            color: #4da3ff;
            text-decoration: none;
        }

        .file a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>leaks</h1>
    <div id="fileList">Loading...</div>

    <script>
        const bucketUrl = "https://cdn.gethyper.lol";

        async function loadFiles() {
            try {
                const response = await fetch(bucketUrl + "?list-type=2");
                const text = await response.text();

                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "application/xml");
                const keys = xml.getElementsByTagName("Key");

                const fileList = document.getElementById("fileList");
                fileList.innerHTML = "";

                if (keys.length === 0) {
                    fileList.innerHTML = "No files found.";
                    return;
                }

                for (let i = 0; i < keys.length; i++) {
                    const fileName = keys[i].textContent;

                    const div = document.createElement("div");
                    div.className = "file";
                    div.innerHTML = `<a href="${bucketUrl}/${fileName}" target="_blank">${fileName}</a>`;

                    fileList.appendChild(div);
                }

            } catch (err) {
                document.getElementById("fileList").innerHTML = "Could not load files. Bucket listing may not be enabled.";
            }
        }

        loadFiles();
    </script>

</body>

</html>
