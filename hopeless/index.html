<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopeless</title>
    <style>
        body {
            background-color: #030303;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal-container {
            max-width: 800px;
            padding: 3rem;
            text-align: left;
            position: relative;
        }

        .glitch-text {
            font-size: 1.2rem;
            line-height: 1.8;
            opacity: 0;
            animation: typeIn 4s steps(60, end) forwards;
            position: relative;
        }

        @keyframes typeIn {
            from {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
            }

            to {
                opacity: 1;
                clip-path: inset(0 0 0 0);
            }
        }

        .enter-link {
            color: #d1d1d1;
            text-decoration: none;
            transition: color 0.3s, text-shadow 0.3s;
            cursor: pointer;
        }

        .enter-link:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
            margin-left: 2px;
            font-size: 1.1rem;
            color: #d1d1d1;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: url('data:image/svg+xml,%3Csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"noiseFilter\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.65\" numOctaves=\"3\" stitchTiles=\"stitch\"/%3E%3C/filter%3E%3Crect width=\"100%25\" height=\"100%25\" filter=\"url(%23noiseFilter)\" opacity=\"0.05\"/%3E%3C/svg%3E');
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="noise"></div>
    <div class="terminal-container">
        <p class="glitch-text">
            Ukraine, 1987. Three months after the explosion. They said everything within thirty kilometers
            was finished. Dead soil. Dead trees. Dead animals. They were wrong. The forest was still alive.<br><br>
            <a href="/hopeless" class="enter-link">Too alive.</a><span class="cursor"></span>
        </p>
    </div>
</body>

</html>
